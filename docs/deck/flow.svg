<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 1160 416" width="1160" height="416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<!-- Hand-drawn: how one request moves through the parts. Edit the text here; charts.py does not touch this file. -->
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<style>
  .w { fill: #f1f0ec; stroke: #c9c8c2; stroke-width: 1.2; }
  .o { fill: #ffffff; stroke: #2a78d6; stroke-width: 2; }
  .m { fill: #eaf2fc; stroke: #2a78d6; stroke-width: 2.4; }
  .t { font-size: 16px; font-weight: 650; fill: #0b0b0b; }
  .s { font-size: 12.5px; letter-spacing: -0.01em; fill: #52514e; }
  .l { font-size: 12px; fill: #8a5a00; font-style: italic; }
  .f { stroke: #52514e; stroke-width: 1.6; fill: none; }
  .fb { stroke: #eb6834; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  .k { font-size: 13px; font-weight: 600; fill: #8a8984; letter-spacing: .08em; }
</style>

<text x="4" y="16" class="k">WIN THE WORK</text>
<text x="4" y="392" class="k">DELIVER IT</text>

<!-- row 1 -->
<rect x="4" y="26" width="208" height="92" rx="10" class="w"/>
<text x="108" y="50" text-anchor="middle" class="t">Dealer request</text>
<text x="108" y="70" text-anchor="middle" class="s">cars, lanes, a note;</text>
<text x="108" y="86" text-anchor="middle" class="s">options, each with a</text>
<text x="108" y="102" text-anchor="middle" class="s">deadline and a list price</text>

<rect x="240" y="26" width="208" height="92" rx="10" class="o"/>
<text x="344" y="50" text-anchor="middle" class="t">Notes reader</text>
<text x="344" y="70" text-anchor="middle" class="s">Finnish, Swedish, English</text>
<text x="344" y="86" text-anchor="middle" class="s">→ ready times, hours,</text>
<text x="344" y="102" text-anchor="middle" class="s">plates, manual licence</text>

<rect x="476" y="26" width="208" height="92" rx="10" class="o"/>
<text x="580" y="50" text-anchor="middle" class="t">Do we want the request?</text>
<text x="580" y="70" text-anchor="middle" class="s">quote an option only if a</text>
<text x="580" y="86" text-anchor="middle" class="s">driver has time to make it;</text>
<text x="580" y="102" text-anchor="middle" class="s">few free drivers: easy cars</text>

<rect x="712" y="26" width="208" height="92" rx="10" class="o"/>
<text x="816" y="50" text-anchor="middle" class="t">Quoter</text>
<text x="816" y="70" text-anchor="middle" class="s">calculates the price with the</text>
<text x="816" y="86" text-anchor="middle" class="s">highest expected margin:</text>
<text x="816" y="102" text-anchor="middle" class="s">margin × chance to win</text>

<rect x="948" y="26" width="208" height="92" rx="10" class="w"/>
<text x="1052" y="50" text-anchor="middle" class="t">Dealer decides</text>
<text x="1052" y="70" text-anchor="middle" class="s">our price against the</text>
<text x="1052" y="86" text-anchor="middle" class="s">competitor's</text>
<text x="1052" y="102" text-anchor="middle" class="s">→ won or lost</text>

<line x1="212" y1="72" x2="238" y2="72" class="f" marker-end="url(#a)"/>
<line x1="448" y1="72" x2="474" y2="72" class="f" marker-end="url(#a)"/>
<line x1="684" y1="72" x2="710" y2="72" class="f" marker-end="url(#a)"/>
<line x1="920" y1="72" x2="946" y2="72" class="f" marker-end="url(#a)"/>
<!-- win/loss moves the level -->
<path d="M 1040 26 C 1040 2, 840 2, 830 24" class="fb" marker-end="url(#b)"/>
<text x="935" y="-4" text-anchor="middle" class="l">every win or loss moves the price level</text>

<!-- middle: the model -->
<rect x="682" y="150" width="268" height="100" rx="12" class="m"/>
<text x="816" y="176" text-anchor="middle" class="t">Machine learning model</text>
<text x="816" y="196" text-anchor="middle" class="s">the driver fee we expect to pay,</text>
<text x="816" y="212" text-anchor="middle" class="s">as a coefficient of the typical fee,</text>
<text x="816" y="228" text-anchor="middle" class="s">and the car's late risk</text>
<line x1="816" y1="150" x2="816" y2="120" class="f" marker-end="url(#a)"/>
<line x1="816" y1="250" x2="816" y2="280" class="f" marker-end="url(#a)"/>

<line x1="1052" y1="118" x2="1052" y2="280" class="f" marker-end="url(#a)"/>
<text x="1062" y="204" class="s">won →</text>
<text x="1062" y="220" class="s">an order</text>

<!-- row 3 -->
<rect x="948" y="282" width="208" height="92" rx="10" class="o"/>
<text x="1052" y="306" text-anchor="middle" class="t">Bundles</text>
<text x="1052" y="326" text-anchor="middle" class="s">up to 3 cars share a gig</text>
<text x="1052" y="342" text-anchor="middle" class="s">when one driver can do</text>
<text x="1052" y="358" text-anchor="middle" class="s">the stops in a row</text>

<rect x="712" y="282" width="208" height="92" rx="10" class="o"/>
<text x="816" y="306" text-anchor="middle" class="t">Fees</text>
<text x="816" y="326" text-anchor="middle" class="s">opens at (expected fee − 0.15)</text>
<text x="816" y="342" text-anchor="middle" class="s">× typical fee; +0.15 after</text>
<text x="816" y="358" text-anchor="middle" class="s">6 daytime h, and a day before</text>

<rect x="476" y="282" width="208" height="92" rx="10" class="w"/>
<text x="580" y="306" text-anchor="middle" class="t">Drivers book</text>
<text x="580" y="326" text-anchor="middle" class="s">a driver books when the</text>
<text x="580" y="342" text-anchor="middle" class="s">fee beats their cost and</text>
<text x="580" y="358" text-anchor="middle" class="s">beats waiting for more</text>

<rect x="240" y="282" width="208" height="92" rx="10" class="w"/>
<text x="344" y="306" text-anchor="middle" class="t">Delivery</text>
<text x="344" y="326" text-anchor="middle" class="s">picked up and delivered</text>
<text x="344" y="342" text-anchor="middle" class="s">by the deadline</text>
<text x="344" y="358" text-anchor="middle" class="s"></text>

<rect x="4" y="282" width="208" height="92" rx="10" class="o"/>
<text x="108" y="306" text-anchor="middle" class="t">Record everything</text>
<text x="108" y="326" text-anchor="middle" class="s">every request, decision</text>
<text x="108" y="342" text-anchor="middle" class="s">and result, kept for</text>
<text x="108" y="358" text-anchor="middle" class="s">analysis and training</text>

<line x1="948" y1="328" x2="922" y2="328" class="f" marker-end="url(#a)"/>
<line x1="712" y1="328" x2="686" y2="328" class="f" marker-end="url(#a)"/>
<line x1="476" y1="328" x2="450" y2="328" class="f" marker-end="url(#a)"/>
<line x1="240" y1="328" x2="214" y2="328" class="f" marker-end="url(#a)"/>

<!-- repairs -->
<path d="M 580 282 C 580 262, 700 262, 712 296" class="fb" marker-end="url(#b)"/>
<text x="560" y="262" text-anchor="middle" class="l">no booking yet: the two planned raises</text>

<!-- retrain -->
<path d="M 108 282 L 108 200 L 680 200" class="fb" marker-end="url(#b)"/>
<text x="130" y="192" class="l">every saved week → retrain the model on 1.9 million orders</text>
</svg>
